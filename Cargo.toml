[package]
name = "unprompted"
version = "1.0.0"
edition = "2021"
description = "Tiny portable app that strips metadata from AI-generated images"
license = "MIT"
rust-version = "1.95"

[lib]
name = "unprompted"
path = "src/lib.rs"

[[bin]]
name = "Unprompted"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37"
rfd = { version = "0.18", default-features = false }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
